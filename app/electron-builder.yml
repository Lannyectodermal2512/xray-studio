appId: dev.xraystudio.app
productName: Xray Studio
copyright: Copyright © 2026 Xray Studio contributors

directories:
  output: ../.build/dist
  buildResources: ../assets

# Only the compiled output. src/ is TypeScript the packaged app never reads, and
# node_modules is resolved by electron-builder from package.json dependencies.
files:
  - out/**/*
  - package.json

# The Go sidecar and the generated reference data live OUTSIDE the asar, because the
# sidecar is an executable — it has to be a real file on disk to be spawned — and the
# data files are looked up by path. Both destinations match what src/main resolves
# against process.resourcesPath.
# Shared by every platform. The sidecar is added per-platform below, because its name
# and the directory it is built into differ by target and a single `from` could only
# ever name one of them.
extraResources:
  - from: ../data/docs-en
    to: docs-en
  - from: ../data/schema
    to: schema
  - from: ../examples
    to: examples

mac:
  icon: ../assets/icon.icns
  extraResources:
    - from: ../.build/bin/mac-${arch}/xray-studio-sidecar
      to: xray-studio-sidecar
  category: public.app-category.developer-tools
  target:
    # universal = one app carrying both Intel and Apple Silicon. The sidecar inside is
    # lipo'd to match; a single-arch one would fail on exactly one of the two, at
    # runtime, with nothing in the build to warn about it.
    - target: dmg
      arch: [universal]
  # Alpha builds are unsigned: signing needs a paid Apple Developer identity, and
  # shipping an ad-hoc signature would only make Gatekeeper's refusal more confusing.
  # The README documents the one-time quarantine removal this requires.
  identity: null
  # Nothing here talks to the camera, microphone or the user's files beyond configs the
  # user picks, so the hardened runtime buys nothing without notarisation.
  hardenedRuntime: false

win:
  icon: ../assets/icon.ico
  extraResources:
    - from: ../.build/bin/win-${arch}/xray-studio-sidecar.exe
      to: xray-studio-sidecar.exe
  target:
    # One installer holding both architectures; it picks at install time.
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: XrayStudio-${version}-windows-setup.${ext}

linux:
  icon: ../assets/icon.png
  category: Development
  synopsis: Test Xray-core configurations with live balancer tracing and fault injection
  extraResources:
    - from: ../.build/bin/linux-${arch}/xray-studio-sidecar
      to: xray-studio-sidecar
  # Linux has no universal binary format — no fat binary, no equivalent — so this is the
  # one place a single file per OS is not achievable. Two remain, named with exactly
  # what `uname -m` prints so choosing between them takes no thought.
  target:
    - target: pacman
      arch: [x64, arm64]

# Arch Linux. fpm's default for pacman is xz; zstd is what pacman itself has used since
# 2020, so the file is a .pkg.tar.zst that `pacman -U` takes without complaint.
pacman:
  compression: zstd
  # ".pacman" says nothing about what the file is; it is a zstd-compressed package
  # tarball, so name it the way pacman itself names them.
  #
  # ${arch} resolves to aarch64 here rather than the arm64 used by the other artefacts,
  # and that is left alone deliberately: aarch64 is Arch's own name for the
  # architecture, and it is what this package declares in .PKGINFO. Matching the
  # metadata matters more than matching the neighbouring filenames.
  artifactName: XrayStudio-${version}-linux-${arch}.pkg.tar.zst

dmg:
  title: Xray Studio ${version}
  artifactName: XrayStudio-${version}-macos-universal.dmg

# ${os} is not decoration: without it the macOS and Windows zips are both
# "XrayStudio-<version>-arm64.zip", and uploading both to one release silently
# overwrites one with the other.
artifactName: XrayStudio-${version}-${os}-${arch}.${ext}

publish: null
