name: ci

# Every push and every pull request. The release workflow runs the same tests, but it
# runs them when a tag already exists — by then a failure is a retraction rather than a
# fix. This is the one that catches things while they are still cheap.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch only needs its newest commit tested. Superseded runs are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - run: npm --prefix app run typecheck
      # The renderer build is a real check, not a formality: electron-vite resolves the
      # @shared alias and the preload bundle, and neither is exercised by tsc alone.
      - run: npm --prefix app run build
      - run: npm --prefix app test

  sidecar:
    name: sidecar (vet, test, cross-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: sidecar/go.sum

      # The sidecar links xray-core through a directory replace, so nothing about it
      # compiles until the pinned checkout exists.
      - name: Reproduce the patched core
        run: ./scripts/bootstrap-xray.sh

      - name: The checkout is PIN plus the committed series, exactly
        run: ./scripts/check-pin.sh

      - run: go -C sidecar vet ./...
      - run: go -C sidecar test ./... -count=1 -timeout 600s

      # The patched core's own tests, including the equivalence test that pins the
      # decision trace to the real strategy code. TestChinaSites needs geoip/geosite
      # assets that are not in the repo and fails the same way on a pristine checkout.
      - name: Patched core
        run: |
          go -C .build/xray-core test ./app/router/ -count=1 -skip 'TestChinaSites'
          go -C .build/xray-core test ./app/observatory/... ./common/errors/ ./features/routing/... -count=1

      # A platform nobody is currently releasing still has to compile. The fault
      # dialer's errno layer is per-OS and behind build tags, which is exactly the kind
      # of code that breaks on a platform you are not looking at.
      - name: Cross-compile every target
        run: |
          for t in "mac x64" "mac arm64" "win x64" "win arm64" "linux x64" "linux arm64"; do
            ./scripts/build-sidecar.sh $t
          done

  tools:
    name: tools (vet, generated data is current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # tools/ is stdlib-only and has no go.sum; naming one would fail the setup.
          cache-dependency-path: tools/go.mod
      - run: go -C tools vet ./...

      # data/docs-*/ is generated and committed. Regenerating must reproduce it byte for
      # byte — otherwise the bundle shipped in the app is not the one this repository
      # describes, and nobody would notice until a tooltip said something the source
      # does not.
      #
      # From the committed download cache (-offline), so the check tests this repository
      # rather than GitHub's availability, and cannot go red because upstream edited a
      # page the pin was supposed to protect us from.
      - name: Documentation bundles are reproducible
        run: |
          set -euo pipefail
          go -C tools run ./docsgen -lang en -offline -out ../data/docs-en
          go -C tools run ./docsgen -lang ru -offline -out ../data/docs-ru
          git diff --exit-code --stat data/ || {
            echo "::error::data/ is stale — run docsgen and commit the result"; exit 1; }
