name: release

# Tag-driven. Pushing v0.1.0-alpha.1 builds every platform and attaches the artefacts to
# a draft release, so they are reviewed before anyone can download them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One failing platform should not hide whether the others are healthy.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win

    runs-on: ${{ matrix.os }}
    # git-bash on the Windows runner, so one set of scripts serves all three.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # The sidecar's only checksummed module set; xray-core comes from the pinned
          # clone via a directory replace and is deliberately not in the cache key.
          cache-dependency-path: sidecar/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm --prefix app ci

      # Builds the sidecar for EVERY target on every runner, so a break on a platform
      # nobody is currently releasing still fails the build that introduced it.
      - name: Build and package
        run: ./scripts/package.sh ${{ matrix.target }}

      - name: Verify the bundle carries what it claims
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            mac)
              APP=".build/dist/mac-universal/Xray Studio.app/Contents"
              RES="$APP/Resources"
              SIDECAR="$RES/xray-studio-sidecar"
              plutil -p "$APP/Info.plist" | grep -q '"CFBundleName" => "Xray Studio"'
              # Universal means universal all the way down: an arm64-only sidecar in a
              # fat app fails on Intel at runtime, with nothing in the build to catch it.
              lipo -info "$SIDECAR" | grep -q 'x86_64 arm64' \
                || { echo "sidecar is not universal"; exit 1; }
              lipo -info "$APP/MacOS/Xray Studio" | grep -q 'x86_64 arm64' \
                || { echo "app binary is not universal"; exit 1; }
              ;;
            linux)
              RES=".build/dist/linux-unpacked/resources"
              SIDECAR="$RES/xray-studio-sidecar"
              ;;
            win)
              RES=".build/dist/win-unpacked/resources"
              SIDECAR="$RES/xray-studio-sidecar.exe"
              ;;
          esac
          test -f "$SIDECAR"                  || { echo "sidecar missing from the bundle"; exit 1; }
          test -f "$RES/docs-en/params.json"  || { echo "docs missing from the bundle"; exit 1; }
          test -f "$RES/schema/protocols.json" || { echo "schema missing from the bundle"; exit 1; }
          echo "bundle contents verified for ${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          # The unpacked trees are build scratch, not artefacts.
          path: |
            .build/dist/*.dmg
            .build/dist/*.exe
            .build/dist/*.pkg.tar.zst
            .build/dist/*-src.tar.gz
            .build/dist/*.blockmap

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            --prerelease \
            dist/*
