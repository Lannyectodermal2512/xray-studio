name: release

# Tag-driven. Pushing v0.2.0 builds every platform and attaches the artefacts to a draft
# release, so they are reviewed before anyone can download them. scripts/release.sh is
# what creates that tag, and it refuses to create one the build would not deserve.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# A second tag pushed while the first is still building must not race it to the release
# API. Releases are not cancelled halfway, though: a half-uploaded release is worse than
# a late one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag is the claim; this checks the repository agrees with it before three runners
  # spend twenty minutes building something misnamed. electron-builder takes the version
  # from app/package.json, so a tag that disagrees produces files called one thing
  # attached to a release called another.
  verify-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag, manifests and CHANGELOG must agree
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for f in package.json app/package.json; do
            HAVE="$(node -p "require('./$f').version")"
            [ "$HAVE" = "$VERSION" ] || {
              echo "::error::$f says $HAVE but the tag says $VERSION"; exit 1; }
          done
          ./scripts/changelog-section.sh "$VERSION" > /dev/null || {
            echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }
          echo "tag, manifests and CHANGELOG all say $VERSION"

  build:
    needs: [verify-tag]
    # workflow_dispatch has no tag to verify, and skipping a needed job would skip this
    # one too.
    if: always() && (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped')
    strategy:
      # One failing platform should not hide whether the others are healthy.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win

    runs-on: ${{ matrix.os }}
    # git-bash on the Windows runner, so one set of scripts serves all three.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # The sidecar's only checksummed module set; xray-core comes from the pinned
          # clone via a directory replace and is deliberately not in the cache key.
          cache-dependency-path: sidecar/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm --prefix app ci

      # fpm shells out to bsdtar to build the .MTREE a pacman package carries. The
      # ubuntu runner does not ship it, and fpm reports the miss as "/bin/bash failed
      # (exit code 127)" from inside a Ruby log line, which names neither bsdtar nor
      # what wanted it.
      - name: Linux packaging tools
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      # Builds the sidecar for EVERY target on every runner, so a break on a platform
      # nobody is currently releasing still fails the build that introduced it.
      - name: Build and package
        run: ./scripts/package.sh ${{ matrix.target }}

      - name: Verify the bundle carries what it claims
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            mac)
              APP=".build/dist/mac-universal/Xray Studio.app/Contents"
              RES="$APP/Resources"
              SIDECAR="$RES/xray-studio-sidecar"
              plutil -p "$APP/Info.plist" | grep -q '"CFBundleName" => "Xray Studio"'
              # Universal means universal all the way down: an arm64-only sidecar in a
              # fat app fails on Intel at runtime, with nothing in the build to catch it.
              lipo -info "$SIDECAR" | grep -q 'x86_64 arm64' \
                || { echo "sidecar is not universal"; exit 1; }
              lipo -info "$APP/MacOS/Xray Studio" | grep -q 'x86_64 arm64' \
                || { echo "app binary is not universal"; exit 1; }
              ;;
            linux)
              RES=".build/dist/linux-unpacked/resources"
              SIDECAR="$RES/xray-studio-sidecar"
              ;;
            win)
              RES=".build/dist/win-unpacked/resources"
              SIDECAR="$RES/xray-studio-sidecar.exe"
              ;;
          esac
          test -f "$SIDECAR"                   || { echo "sidecar missing from the bundle"; exit 1; }
          test -f "$RES/docs-en/params.json"   || { echo "docs missing from the bundle"; exit 1; }
          test -f "$RES/docs-ru/params.json"   || { echo "ru docs missing from the bundle"; exit 1; }
          test -f "$RES/schema/protocols.json" || { echo "schema missing from the bundle"; exit 1; }
          echo "bundle contents verified for ${{ matrix.target }}"

      # Every download the README offers has to be here. The list used to omit *.zip and
      # *.AppImage, which silently dropped BOTH Windows builds — the README's primary
      # Windows download — and the Linux fallback, leaving a release that looked complete
      # because the files it did have were the ones anyone thought to check.
      - name: Check the expected artefacts exist
        run: |
          set -euo pipefail
          cd .build/dist
          case "${{ matrix.target }}" in
            mac)   want=("*-macos-universal.dmg") ;;
            win)   want=("*-win-x64.zip" "*-win-arm64.zip") ;;
            # x86_64/aarch64, not x64/arm64: package.sh renames the pacman files to
            # what `uname -m` prints, which is the string the README tells people to
            # compare against and the one the package's own .PKGINFO declares.
            linux) want=("*-linux-x86_64.pkg.tar.zst" "*-linux-aarch64.pkg.tar.zst" "*.AppImage") ;;
          esac
          for pattern in "${want[@]}"; do
            # shellcheck disable=SC2086
            compgen -G $pattern > /dev/null || { echo "::error::no artefact matching $pattern"; exit 1; }
          done
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          # The unpacked trees are build scratch, not artefacts.
          path: |
            .build/dist/*.dmg
            .build/dist/*.zip
            .build/dist/*.AppImage
            .build/dist/*.pkg.tar.zst
            .build/dist/*-src.tar.gz
            .build/dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh dist
          VERSION="${GITHUB_REF_NAME#v}"

          # The body is this version's CHANGELOG section, not the whole file — the same
          # text scripts/release.sh required before it would make the tag.
          ./scripts/changelog-section.sh "$VERSION" > notes.md
          {
            echo
            echo "---"
            echo
            echo "Built from \`${GITHUB_SHA}\`. Which file to take is in the [README](https://github.com/${GITHUB_REPOSITORY}#install)."
          } >> notes.md

          # A prerelease is anything with a suffix — 0.2.0-beta.1 but not 0.2.0. GitHub
          # shows those under "Pre-release" and keeps "Latest" pointing at the last
          # stable one, which is what a first-time visitor is offered.
          PRE=()
          case "$VERSION" in *-*) PRE=(--prerelease) ;; esac

          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "${PRE[@]}" \
            dist/*

          echo "::notice::Draft release ${GITHUB_REF_NAME} created. Review it, then press Publish."
